# Tag a version (git tag v0.2.0 && git push --tags) and this builds every
# installer and publishes them on the public downloads repository,
# MahmoudAdelMansour/laramonster-releases. The source stays in this private repo.
#
# Secrets (Settings → Secrets and variables → Actions):
#   RELEASES_TOKEN       fine-grained token, "Contents: Read and write" on laramonster-releases only (required)
#   macOS signing (optional; without them the app is built unsigned):
#   MACOS_CERT_P12       base64 of the "Developer ID Application" certificate exported as .p12
#   MACOS_CERT_PASSWORD  the .p12 password
#   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   for notarisation (app-specific password)
#
# Windows: besides the plain .exe, every release builds LaraMonster-windows-x64.msix
# for the Microsoft Store (Partner Center → LaraMonster → Packages). The Store signs it.
#
# Nothing is published unless the smoke test passes on Linux, macOS and Windows:
# install PHP, link a demo site, start the engine, load the page (scripts/smoke.sh).
name: Release

on:
  push:
    tags: ['v*']
  # Manual runs (Actions → Release → Run workflow): build and smoke-test
  # everything without publishing.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Desktop app libraries (GTK3 + WebKitGTK 4.1)
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: make test
      - name: Linux app + CLI
        run: make cli app VERSION=${{ github.ref_name }}
      - name: Smoke test (Linux)
        run: ./scripts/smoke.sh bin/laramonster 8.4
      - run: ./scripts/package-linux.sh amd64
      - name: CLI for every platform + Windows app (cross-compiled)
        run: |
          mv dist/LaraMonster-linux-amd64.tar.gz /tmp/
          make release VERSION=${{ github.ref_name }}
          mv /tmp/LaraMonster-linux-amd64.tar.gz dist/
          rm -f dist/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with: { name: linux-and-windows, path: dist/ }

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: "Unit tests (macOS: self-update, trust, terminal setup)"
        run: go test ./internal/selfupdate/ ./internal/update/ ./internal/core/ ./internal/trust/
      - name: Smoke test (macOS)
        run: |
          go build -o bin/laramonster ./cmd/laramonster
          ./scripts/smoke.sh bin/laramonster 8.4
      - name: Signing certificate (when the secrets exist)
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        if: env.MACOS_CERT_P12 != ''
        run: |
          KC="$RUNNER_TEMP/sign.keychain-db"; PW="$(openssl rand -hex 16)"
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$PW" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -P "$MACOS_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -k "$PW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          ID="$(security find-identity -v -p codesigning "$KC" | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          echo "MACOS_SIGN_IDENTITY=$ID" >> "$GITHUB_ENV"
      - name: Package (signed + notarised when possible)
        env:
          VERSION: ${{ github.ref_name }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with: { name: macos, path: dist/ }

  windows:
    needs: linux
    runs-on: windows-latest
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: "Unit tests (Windows: self-update)"
        run: go test ./internal/selfupdate/ ./internal/update/
      - uses: actions/download-artifact@v4
        with: { name: linux-and-windows, path: dist }
      - name: Smoke test (Windows, plain .exe)
        run: ./scripts/smoke.sh dist/laramonster-cli-windows-amd64.exe 8.4
      - name: "Microsoft Store package (.msix, unsigned: the Store signs it)"
        shell: pwsh
        run: ./scripts/package-msix.ps1 -Tag "${{ github.ref_name }}" -App dist/LaraMonster-windows-amd64.exe -Cli dist/laramonster-cli-windows-amd64.exe -Out store/LaraMonster-windows-x64.msix
      - name: Install a test-signed copy, like Windows would from the Store
        shell: pwsh
        run: |
          $publisher = "CN=678879E9-F2C0-4AEF-AFDD-29D566C9F533"
          $cert = New-SelfSignedCertificate -Type Custom -Subject $publisher -KeyUsage DigitalSignature -FriendlyName "LaraMonster smoke test" -CertStoreLocation "Cert:\CurrentUser\My" -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3", "2.5.29.19={text}")
          $pw = ConvertTo-SecureString -String "smoke" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "$env:RUNNER_TEMP\smoke.pfx" -Password $pw | Out-Null
          Import-PfxCertificate -FilePath "$env:RUNNER_TEMP\smoke.pfx" -CertStoreLocation Cert:\LocalMachine\TrustedPeople -Password $pw | Out-Null
          Copy-Item store/LaraMonster-windows-x64.msix "$env:RUNNER_TEMP\test.msix"
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /fd SHA256 /f "$env:RUNNER_TEMP\smoke.pfx" /p smoke "$env:RUNNER_TEMP\test.msix"
          if ($LASTEXITCODE -ne 0) { throw "signtool failed" }
          Add-AppxPackage -Path "$env:RUNNER_TEMP\test.msix"
          Get-AppxPackage Laramonster.LaraMonster | Format-List Name, Version, InstallLocation
      - name: "Smoke test (Windows, installed Store package, via the laramonster alias)"
        run: ./scripts/smoke.sh "$LOCALAPPDATA/Microsoft/WindowsApps/laramonster.exe" 8.4
      - uses: actions/upload-artifact@v4
        with: { name: windows-store, path: store/ }

  publish:
    needs: [linux, macos, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Publish on laramonster-releases
        uses: softprops/action-gh-release@v2
        with:
          repository: MahmoudAdelMansour/laramonster-releases
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: LaraMonster ${{ github.ref_name }}
          # A tag with "-" (v0.3.0-beta.1) is a pre-release: the update check skips it.
          prerelease: ${{ contains(github.ref_name, '-') }}
          body: |
            ## Download

            | System | File |
            |---|---|
            | Windows 10/11 | [Microsoft Store](https://apps.microsoft.com/detail/9NRLB8PVVP9X) (recommended), or `LaraMonster-windows-amd64.exe` |
            | macOS 11+ (Apple Silicon and Intel) | `LaraMonster-macos-universal.zip` |
            | Linux (x86-64) | `LaraMonster-linux-amd64.tar.gz`, unpack and run `./LaraMonster/install.sh` |

            ## First launch

            - **macOS:** unzip, drag LaraMonster into Applications and open it. When macOS says it *could not verify* LaraMonster, click **Done**, then **System Settings → Privacy & Security → Open Anyway**.
            - **Windows (.exe):** if *Windows protected your PC* appears, click **More info → Run anyway**.

            Only the first launch asks; LaraMonster updates itself after that. Step-by-step guide: https://github.com/MahmoudAdelMansour/laramonster-releases#install

            Command-line only: `laramonster-cli-<os>-<arch>`. Verify with `SHA256SUMS`. `LaraMonster-windows-x64.msix` is the Microsoft Store package.

            LaraMonster is free. Pro (Event Tracker, Jobs & Queues): https://monstersgate.com/laramonster
          files: dist/*
